[project]
name = "carburantes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RodrigoM10", email = "rodrigom10.w@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
carburantes = "carburantes:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-requests>=2.33.0.20261030",
]
